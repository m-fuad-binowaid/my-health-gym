name: Deploy My Health Gym to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm --filter @workspace/my-health-gym run build
        env:
          NODE_ENV: production
          PORT: 5173
          BASE_PATH: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://jxymyezzkspdbcmstkhp.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4eW15ZXp6a3NwZGJjbXN0a2hwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MTkyNTQsImV4cCI6MjEwNDk5NTI1NH0.j5mW5i1tIZCL-UCNnC_B6mhmkznKd7hknEESrnDlP84' }}

      - name: Add GitHub Pages marker and CNAME
        run: |
          touch artifacts/my-health-gym/dist/public/.nojekyll
          echo "myhealthsa.com" > artifacts/my-health-gym/dist/public/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/my-health-gym/dist/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
